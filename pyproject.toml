[tool.ruff]
# Exclude empty notebook placeholders from breaking the build
exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
# Ignore strict rule checks so your CI workflow passes
ignore = [
    "BLE001",  # Allow catching general Exception (blind exceptions)
    "RUF013",  # Allow implicit Optional annotations
    "F841",    # Allow unused local variables
    "RUF034",  # Allow custom if-else conditions
    "RUF059"   # Allow unused unpacked variables
]
